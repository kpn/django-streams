version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "fix(deps)"
    groups:
      python-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "kstreams"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "fix(ci)"
    groups:
      all-actions-dependencies:
        patterns:
          - "*"
