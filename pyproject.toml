[tool.poetry]
name = "django-streams"
version = "4.0.0"
description = "Django application to produce/consume events from Kafka"
authors = ["Marcos Schroh <marcos.schroh@kpn.com>"]
readme = "README.md"
packages = [{ include = "django_streams" }]
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: System :: Networking",
  "Topic :: System :: Distributed Computing",
  "Framework :: AsyncIO",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.commitizen]
version_provider = "poetry"
tag_format = "$version"
version_files = [
  "mkdocs.yml:version",
]
update_changelog_on_bump = true

[[tool.mypy.overrides]]
module = "django.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiokafka.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "kafka.*"
ignore_missing_imports = true

[tool.poetry.dependencies]
django = ">=2"
kstreams = ">=0.34.0"
python = "^3.11"

[tool.poetry.group.dev.dependencies]
mkdocs = "^1.5.3"
mkdocs-material = "^9.5.49"
mkdocstrings = { version = ">=0.27,<1.1", extras = ["python"] }
mypy = "^2"
pytest = "^9"
pytest-asyncio = "^1"
pytest-benchmark = "^5"
pytest-cov = "^7"
pytest-django = "^4.14"
pytest-order = "^1.5.0"
ruff = "^0.17"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.testing_app.settings"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
  # Pyflakes
  "F",
  # isort
  "I001"
]
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  ".venv",
]
